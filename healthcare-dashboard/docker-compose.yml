# =============================================================================
# Medicare Pro — Production Compose Stack
# Use for single-host / staging deployments. For multi-node, hospital-scale
# deployments, use deploy/k8s instead (see docs/DEPLOYMENT.md).
#
#   docker compose --env-file .env.production up -d --build
# =============================================================================
name: medicare-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-medicare_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_DB: ${PGDATABASE:-medicare_pro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend-net]
    # No ports published by default — DB is only reachable inside the
    # compose network. Uncomment for local debugging only:
    # ports: ["5432:5432"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-medicare_app}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      PGDATABASE: ${PGDATABASE:-medicare_pro}
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      OCR_LANG: ${OCR_LANG:-eng}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
    volumes:
      - uploads:/data/uploads
    networks: [backend-net, frontend-net]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks: [frontend-net]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "src/db/migrate.js"]
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-medicare_app}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      PGDATABASE: ${PGDATABASE:-medicare_pro}
    networks: [backend-net]
    profiles: ["migrate"] # run on demand: docker compose --profile migrate run --rm migrate

networks:
  backend-net:
    driver: bridge
    internal: true # DB + migrate are not reachable from outside the host
  frontend-net:
    driver: bridge

volumes:
  pgdata:
  uploads:
