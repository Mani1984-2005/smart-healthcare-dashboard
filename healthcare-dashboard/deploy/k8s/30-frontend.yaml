apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: medicare-pro
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: REGISTRY/medicare-pro-frontend:__TAG__
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: medicare-pro
spec:
  selector: { app: frontend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicare-pro-ingress
  namespace: medicare-pro
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m" # allow prescription image/PDF uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["medicare-pro.example-hospital.org"]
      secretName: medicare-pro-tls
  rules:
    - host: medicare-pro.example-hospital.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 5000 } } }
          - path: /uploads
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 5000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 8080 } } }
