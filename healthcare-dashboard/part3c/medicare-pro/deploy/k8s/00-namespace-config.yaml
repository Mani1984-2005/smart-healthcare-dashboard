apiVersion: v1
kind: Namespace
metadata:
  name: medicare-pro
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medicare-pro-config
  namespace: medicare-pro
data:
  NODE_ENV: "production"
  PORT: "5000"
  PGHOST: "postgres"
  PGPORT: "5432"
  PGDATABASE: "medicare_pro"
  UPLOAD_DIR: "/data/uploads"
  MAX_FILE_SIZE_MB: "15"
  OCR_LANG: "eng"
  VITE_API_BASE_URL: "/api"
---
# Create the real secret out-of-band, e.g.:
#   kubectl create secret generic medicare-pro-secrets -n medicare-pro \
#     --from-literal=PGUSER=medicare_app \
#     --from-literal=PGPASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=CLIENT_ORIGIN=https://medicare-pro.example-hospital.org
# or manage it via your secret store (Vault, Sealed Secrets, External
# Secrets Operator). This manifest is a placeholder only — do not apply
# it with real values checked into source control.
apiVersion: v1
kind: Secret
metadata:
  name: medicare-pro-secrets
  namespace: medicare-pro
type: Opaque
stringData:
  PGUSER: "medicare_app"
  PGPASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  CLIENT_ORIGIN: "https://medicare-pro.example-hospital.org"
