apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medicare-pro
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: REGISTRY/medicare-pro-backend:__TAG__
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: medicare-pro-config }
            - secretRef: { name: medicare-pro-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        # ReadWriteMany PVC (NFS/EFS/Azure Files) so any backend replica can
        # serve any previously-uploaded prescription image. Swap for S3/GCS/
        # Blob Storage + a signed-URL upload flow at true hospital scale.
        - name: uploads
          persistentVolumeClaim: { claimName: uploads-pvc }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: medicare-pro
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medicare-pro
spec:
  selector: { app: backend }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: medicare-pro
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
